<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Тайный Санта · организатор</title>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: var(--bg); }
    .adm { padding-block: 40px 56px; display: grid; gap: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .row input { flex: 1 1 200px; margin-top: 0; }
    .btn.sm { font-size: .9rem; padding: 12px 18px; }
    .hint-small { font-size: .88rem; color: var(--muted); margin: 0 0 10px; }
    .stats { font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 3px dashed rgba(0,0,0,.2); overflow-wrap: anywhere; }
    .scroll { overflow-x: auto; }
    #msg { min-height: 1.5em; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap adm">
    <h2 class="plaque">Организатор</h2>

    <div class="parch panel">
      <label class="field" for="token">Пароль администратора
        <div class="row"><input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN">
        <button class="btn sm" id="load" type="button">Войти</button></div>
      </label>
      <p id="msg" role="status" aria-live="polite"></p>
    </div>

    <div class="parch panel" id="panel" hidden>
      <p class="stats" id="stats"></p>
      <div class="row">
        <input id="test-to" type="email" placeholder="Адрес для проверки почты">
        <button class="btn sm" id="test" type="button">Тест письма</button>
      </div>
      <p></p>
      <div class="row">
        <button class="btn sm" id="draw" type="button">Провести жеребьёвку</button>
        <button class="btn sm" id="send" type="button">Дослать неотправленные</button>
        <button class="btn sm" id="csv" type="button">Скачать таблицу (CSV)</button>
      </div>
      <p></p>
      <p class="hint-small">Таблица показывает, кто кому дарит. Её видит только организатор, для остальных пары скрыты.</p>
      <div class="scroll"><table><thead><tr><th>№</th><th>Имя</th><th>E-mail</th><th>Дарит №</th><th>Дарит кому</th><th>Кто дарит ему</th><th>Письмо</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
